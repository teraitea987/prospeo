name: prospeo
services:
  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: prospeo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Initialiser .env avec pnpm db:setup}
      POSTGRES_DB: prospeo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prospeo -d prospeo"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
